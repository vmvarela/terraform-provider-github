# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes#configuring-automatically-generated-release-notes

changelog:
  categories:
    - title: 💥 Breaking Changes
      labels:
        - "breaking"

    - title: 🚀 New Features
      labels:
        - "enhancement"

    - title: 🐛 Bugfixes
      labels:
        - "bug"

    - title: 📝 Documentation
      labels:
        - "documentation"

    - title: 🏷 Other Changes
      labels:
        - "*"
