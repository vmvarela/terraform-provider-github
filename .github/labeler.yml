# Configuration for actions/labeler. Labels are standard GitHub labels.

enhancement:
  - head-branch:
      - '^feat/'
      - '^feature/'
  - changed-files:
      - any-glob-to-any-file:
          - "github/resource_*.go"
          - "github/data_source_*.go"

bug:
  - head-branch:
      - '^fix/'
      - '^bugfix/'

documentation:
  - head-branch:
      - '^docs/'
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "website/**"
