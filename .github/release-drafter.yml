name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
categories:
  - title: "🚀 Features"
    labels:
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
  - title: "📝 Documentation"
    labels:
      - "documentation"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
autolabeler:
  - label: "enhancement"
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: "bug"
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: "documentation"
    title:
      - '/^docs(\(.+\))?!?:/i'
version-resolver:
  patch:
    labels:
      - "breaking"
      - "enhancement"
      - "bug"
      - "documentation"
  default: patch
